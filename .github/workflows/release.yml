# v* タグを push すると Windows でビルドし、Releases に sakura2.exe と sha256、
# インストーラー sakura2-setup-<version>.exe を添付する。
# エディタの自動アップデートは sakura2.exe と sha256 の 2 ファイルを取得して検証・適用する。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: タグと Cargo.toml のバージョン一致を確認
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if ("v$ver" -ne "${{ github.ref_name }}") { throw "タグ ${{ github.ref_name }} と Cargo.toml の v$ver が一致しません" }

      - name: テスト
        run: cargo test --release

      - name: ビルド
        run: cargo build --release

      - name: 成果物を作成
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/sakura2.exe dist/sakura2.exe
          $h = (Get-FileHash dist/sakura2.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/sakura2.exe.sha256 -Value "$h  sakura2.exe" -NoNewline -Encoding ascii

      - name: インストーラーを作成
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup のインストールに失敗しました" }
          }
          & $iscc "/DAppVersion=$ver" installer\sakura2.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC が失敗しました ($LASTEXITCODE)" }

      - name: Release を作成
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          gh release create "${{ github.ref_name }}" dist/sakura2.exe dist/sakura2.exe.sha256 "dist/sakura2-setup-$ver.exe" THIRD_PARTY_NOTICES.txt --title "${{ github.ref_name }}" --generate-notes
